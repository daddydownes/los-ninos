<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Owner sign in · Los Niños</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/owner-login.css">
  <script type="module" src="/owner-login.js"></script>
</head>
<body>
  <header><a class="brand" href="/" aria-label="Los Niños home">LOS<br>NIÑOS</a><a href="/">Back to the store <span aria-hidden="true">↗</span></a></header>
  <main>
    <p class="eyebrow">THE OWNER WORKSPACE</p>
    <h1>Welcome back.</h1>
    <p class="intro">Your orders, ready when you are.</p>
    <form id="email-form">
      <label for="owner-email">Owner email</label>
      <input id="owner-email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required>
      <p class="help">We’ll email a one-time sign-in code to an approved owner address.</p>
      <button type="submit">Send sign-in code <span aria-hidden="true">→</span></button>
    </form>
    <form id="code-form" hidden>
      <label for="owner-code">Six-digit code</label>
      <input id="owner-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required aria-describedby="code-help">
      <p class="help" id="code-help">Check your inbox and spam folder. The code expires in 10 minutes; use it in this browser.</p>
      <button type="submit">Open dashboard <span aria-hidden="true">→</span></button>
      <div class="secondary"><button id="resend-code" type="button">Send a new code</button><button id="change-email" type="button">Change email</button></div>
    </form>
    <p id="login-message" role="status" aria-live="polite" hidden></p>
    <noscript><p>Please enable JavaScript to sign in.</p></noscript>
  </main>
  <footer>LOS NIÑOS CON SUEÑOS</footer>
</body>
</html>
