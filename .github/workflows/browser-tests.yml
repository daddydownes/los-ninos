name: Safari and Chrome regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: npm test
      - name: Check published photo journey under rapid scrolling and image failures
        run: npm run test:zoom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            .local/zoom-test-report/
          retention-days: 14
