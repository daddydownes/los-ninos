<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photographic rotation review</title>
<style>body{margin:0;background:#eeece5;color:#172331;font:15px Arial,sans-serif}header{padding:20px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}button,a{color:inherit}button{padding:10px 16px}#wrap{height:700px;overflow:hidden}iframe{border:0;display:block;transform-origin:top left}label{padding:12px;display:block}.orbit-stage{position:relative;width:100%;height:570px}.orbit-canvas{position:absolute;inset:0}.orbit-canvas canvas{display:block;width:100%;height:100%}.orbit-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.orbit-ready .orbit-poster{visibility:hidden}.orbit-retry{position:absolute;z-index:4;bottom:16px;left:35%}.spin-loading{position:absolute;z-index:5;bottom:22px;width:100%;text-align:center;background:#eeece5}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.below{height:900px;background:#172331;color:white;padding:30px}#test-area{max-width:900px;margin:auto}@media(max-width:700px){.orbit-stage{height:clamp(300px,90vw,430px)}}</style>
<main id="wrapper" hidden><header><b>Photo rotation — local QA</b><button data-width="375">Phone 375</button><button data-width="900">Desktop 900</button><a href="/">Integrated demo</a></header><div id="wrap"><iframe title="Rotation test viewport"></iframe></div></main>
<main id="test-area" hidden><header><a href="#below">Check offscreen pause ↓</a><label><input type="checkbox" data-motion-preview> Reduced-motion preview</label></header><section data-orbit aria-label="Explore the hat"><div class="orbit-stage" data-orbit-stage><img class="orbit-poster" src="/rotation-assets/photo-turn-poster.webp" alt="Original photographic hat"><div class="orbit-canvas" data-orbit-canvas></div></div><div class="orbit-toolbar" hidden><input data-orbit-slider type="range" disabled></div><p id="orbit-instructions" hidden></p><p class="sr-only" role="status" data-orbit-status></p></section><div id="below" class="below"><a href="#test-area">Return to rotation ↑</a><p>The rotation should pause while offscreen.</p></div></main>
<script>if(new URLSearchParams(location.search).has('frame')){document.querySelector('#test-area').hidden=false;const script=document.createElement('script');script.src='/hat-rotation.js';document.body.append(script)}else{document.querySelector('#wrapper').hidden=false;const frame=document.querySelector('iframe');frame.src='/rotation-check.html?frame=1';function size(w){const scale=Math.min(1,(innerWidth-20)/w);frame.style.width=w+'px';frame.style.height='760px';frame.style.transform='scale('+scale+')';document.querySelector('#wrap').style.height=760*scale+'px'}document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>size(Number(b.dataset.width)));size(900)}</script>
