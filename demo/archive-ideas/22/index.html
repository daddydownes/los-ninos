<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>22 — Ripple rail / Los Niños</title><style>
@font-face{font-family:Barlow;src:url('../assets/fonts/barlow-condensed-800-latin.woff2');font-weight:800;font-display:swap}@font-face{font-family:DM;src:url('../assets/fonts/dm-sans-latin.woff2');font-weight:100 900;font-display:swap}:root{--navy:#08121d;--cream:#f1eee6;--ice:#b8daef}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--cream);font-family:DM,Arial,sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--ice);outline-offset:4px}header{padding:24px 4vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f1eee62a}.brand{font-family:Barlow;font-size:25px;line-height:.85}header span{font-size:9px;letter-spacing:1.6px;color:var(--ice);text-transform:uppercase}.intro{padding:42px 4vw 32px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--ice);text-transform:uppercase;margin:0 0 17px}h1{font-family:Barlow;font-size:clamp(76px,10vw,150px);font-weight:800;line-height:.8;letter-spacing:-.02em;margin:0}.intro>p{font-size:11px;line-height:1.7;max-width:225px;color:#bec9d1;margin:0}.viewport{height:560px;overflow:hidden;position:relative;touch-action:pan-y;cursor:grab;user-select:none}.viewport.dragging{cursor:grabbing}.rail{height:100%;display:flex;gap:8px;position:absolute;left:0;top:0;will-change:transform}.frame{height:100%;position:relative;overflow:hidden;flex:none;background:#17222d;isolation:isolate}.frame img{width:100%;height:100%;object-fit:cover;object-position:center 42%;pointer-events:none;filter:brightness(calc(.63 + var(--power,0)*.37)) saturate(calc(.45 + var(--power,0)*.55));transform:scale(calc(1.08 - var(--power,0)*.06));will-change:transform}.frame:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#08121dd0,transparent 42%,transparent 80%,#08121d30)}.frame button{position:absolute;inset:0;width:100%;border:0;background:transparent;z-index:2;text-align:left;padding:0}.frame button:focus-visible{outline-offset:-5px}.number{position:absolute;left:17px;top:18px;font-size:10px;letter-spacing:1px;width:30px;height:30px;display:grid;place-items:center;background:#08121d70;border:1px solid #f1eee666;border-radius:50%;transition:background .2s,color .2s}.frame.selected .number{background:var(--ice);color:var(--navy);border-color:var(--ice)}.frame.selected:before{content:'';position:absolute;z-index:4;left:0;right:0;top:0;height:3px;background:var(--ice)}.frame-title{position:absolute;bottom:26px;left:21px;right:12px;z-index:3;pointer-events:none;overflow:hidden;white-space:nowrap}.frame-title span{font-size:8px;letter-spacing:1.5px;color:var(--ice);display:block;margin-bottom:8px}.frame-title strong{font-family:Barlow;font-size:clamp(28px,4vw,56px);line-height:1;display:block;transform:translateY(calc((1 - var(--power,0))*8px));opacity:calc(.45 + var(--power,0)*.55)}.controls{padding:26px 4vw 30px;display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:40px}.current small{font-size:8px;letter-spacing:1.5px;color:var(--ice);display:block;margin-bottom:7px}.current strong{font-size:12px;font-weight:500}.travel{display:flex;align-items:center;gap:17px}.travel button{width:40px;height:40px;flex:none;border:1px solid #f1eee645;background:transparent;font-size:19px}.travel button:hover,.view:hover{background:var(--ice);color:var(--navy)}input[type=range]{width:100%;min-width:50px;accent-color:var(--ice);cursor:ew-resize;height:30px}.view{justify-self:end;border:1px solid #f1eee670;border-radius:26px;padding:14px 22px;background:transparent;font-size:11px;min-height:46px}.view span{margin-left:22px;font-size:16px}.hint{margin:0;padding:0 4vw 30px;font-size:9px;color:#9eafb9;display:flex;justify-content:space-between;gap:20px}.mobile{display:none}dialog{margin:0;padding:0;border:0;width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;background:var(--navy);color:var(--cream)}dialog::backdrop{background:var(--navy)}.viewer{height:100%;display:grid;grid-template-rows:64px minmax(0,1fr) 62px}.viewer-head,.viewer-foot{padding:0 4vw;display:flex;align-items:center;justify-content:space-between;font-size:11px}.viewer button{padding:10px 15px;min-height:40px;border:1px solid #f1eee660;background:transparent}.viewer img{width:100%;height:100%;object-fit:contain}.viewer-foot div{display:flex;gap:8px}@media(min-width:1450px){.viewport{height:650px}}@media(max-width:650px){header{padding:20px}header span{font-size:8px}.intro{display:block;padding:32px 20px 25px}h1{font-size:76px}.eyebrow{font-size:9px;margin-bottom:14px}.intro>p{font-size:11px;margin-top:20px;max-width:260px}.viewport{height:450px}.rail{gap:6px}.frame-title{left:17px;bottom:23px}.frame-title strong{font-size:35px}.controls{padding:22px 20px;grid-template-columns:1fr auto;gap:22px}.travel{grid-row:2;grid-column:1/-1;gap:16px}.travel button{width:44px;height:44px}.view{font-size:10px;padding:12px 16px}.view span{margin-left:14px}.hint{padding:0 20px 26px;font-size:8px;line-height:1.5}.desktop{display:none}.mobile{display:inline}.current strong{font-size:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.frame img{will-change:auto}}
</style></head><body><header><div class="brand" aria-label="Los Niños">LOS<br>NIÑOS</div><span>Photo archive / 22</span></header><main><div class="intro"><div><p class="eyebrow">Ripple rail / Selected photographs</p><h1>IN THE FRAME.</h1></div><p>Move across the photographs.<br>Drag the rail to see what comes next.</p></div><section class="viewport" aria-label="Photograph rail. Drag to explore, select a photograph to expand it."><div class="rail"></div></section><div class="controls"><div class="current"><small id="counter">01 / 09</small><strong id="current-title">Portrait</strong></div><div class="travel"><button id="back" aria-label="Previous photograph">←</button><input id="position" type="range" min="0" max="8" step="1" value="0" aria-label="Choose photograph"><button id="forward" aria-label="Next photograph">→</button></div><button class="view" id="view">View photo <span aria-hidden="true">↗</span></button></div><p class="hint"><span class="desktop">Move to expand · Drag to travel · Arrow keys to explore</span><span class="mobile">Drag to travel · Tap to select · Tap again to view</span><span>09 photographs / Los Niños</span></p></main><dialog aria-label="Full photograph"><div class="viewer"><div class="viewer-head"><span id="viewer-title"></span><button id="close">Close ×</button></div><img id="large" alt=""><div class="viewer-foot"><span id="viewer-count"></span><div><button id="viewer-back" aria-label="Previous photograph">←</button><button id="viewer-next" aria-label="Next photograph">→</button></div></div></div></dialog><script>
const photos=[
 ['portrait.webp','PORTRAIT','Black and white portrait of a man in a Los Niños cap holding a microphone'],
 ['street.webp','ON THE STREET','Man in a navy cap and white shirt beside a sunlit concrete wall'],
 ['hat-detail.webp','THE DETAIL','Close view of an embroidered Los Niños cap'],
 ['photo-04.webp','ANOTHER ANGLE','Overhead photograph of a navy cap embroidered with los niños con sueños'],
 ['caps.webp','THE CAPS','Caps from the Los Niños collection'],
 ['photo-01.webp','FRAME SIX','Photograph from the Los Niños archive'],
 ['photo-02.webp','FRAME SEVEN','Photograph from the Los Niños archive'],
 ['photo-03.webp','FRAME EIGHT','Photograph from the Los Niños archive'],
 ['photo-05.webp','FRAME NINE','Photograph from the Los Niños archive']
];
const viewport=document.querySelector('.viewport'),rail=document.querySelector('.rail'),slider=document.querySelector('#position'),dialog=document.querySelector('dialog');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let widths=[],powers=[],scroll=0,targetScroll=0,active=0,pointer=null,drag=null,loop=0,lastTime=0,suppress=0,returnFocus=null;
const panels=photos.map((p,i)=>{const frame=document.createElement('article');frame.className='frame'+(i===0?' selected':'');frame.innerHTML=`<img src="../assets/photos/${p[0]}" alt="${p[2]}" draggable="false"><button aria-label="Select ${p[1].toLowerCase()}, photograph ${i+1}" aria-pressed="${i===0}"><span class="number">${String(i+1).padStart(2,'0')}</span></button><div class="frame-title"><span>LOS NIÑOS / ${String(i+1).padStart(2,'0')}</span><strong>${p[1]}</strong></div>`;rail.append(frame);const button=frame.querySelector('button');button.addEventListener('click',()=>{if(Date.now()<suppress)return;if(active===i)openViewer();else select(i)});button.addEventListener('focus',()=>{if(!drag)select(i)});button.addEventListener('keydown',e=>{let n;if(e.key==='ArrowRight')n=i+1;if(e.key==='ArrowLeft')n=i-1;if(e.key==='Home')n=0;if(e.key==='End')n=photos.length-1;if(n!==undefined){e.preventDefault();select(n);panels[active].querySelector('button').focus()}});return frame});
function metrics(){const mobile=viewport.clientWidth<650;return{base:mobile?88:132,extra:mobile?178:260,gap:mobile?6:8}}
function starts(){const {gap}=metrics();let x=0;return widths.map(w=>{const left=x;x+=w+gap;return left})}
function maxScroll(){return Math.max(0,widths.reduce((a,b)=>a+b,0)+metrics().gap*(photos.length-1)-viewport.clientWidth)}
function updateActive(i){active=Math.max(0,Math.min(photos.length-1,i));panels.forEach((p,j)=>{p.classList.toggle('selected',j===active);p.querySelector('button').setAttribute('aria-pressed',String(j===active))});slider.value=active;document.querySelector('#counter').textContent=`${String(active+1).padStart(2,'0')} / 09`;document.querySelector('#current-title').textContent=photos[active][1];slider.setAttribute('aria-valuetext',photos[active][1]);}
function select(i){pointer=null;updateActive(i);wake()}
function wake(){if(!loop){lastTime=performance.now();loop=requestAnimationFrame(tick)}}
function tick(now){loop=0;const {base,extra,gap}=metrics(),dt=Math.min(40,now-lastTime||16);lastTime=now;const ease=reduced.matches?1:1-Math.exp(-dt/105);let positions=starts(),focus=active,waveFocus=active;
 if(pointer!==null){const point=pointer+scroll;let best=Infinity;positions.forEach((x,i)=>{const d=Math.abs(x+widths[i]/2-point);if(d<best){best=d;focus=i}});if(focus!==active)updateActive(focus);const centers=positions.map((x,i)=>x+widths[i]/2);waveFocus=focus;if(point<=centers[0])waveFocus=0;else if(point>=centers[centers.length-1])waveFocus=centers.length-1;else{for(let i=0;i<centers.length-1;i++){if(point>=centers[i]&&point<=centers[i+1]){waveFocus=i+(point-centers[i])/(centers[i+1]-centers[i]);break}}}}
 let energy=0;const targets=panels.map((_,i)=>Math.exp(-Math.pow((i-waveFocus)/.88,2)));targets.forEach(v=>energy+=v);
 let motion=0;panels.forEach((p,i)=>{const goal=base+extra*targets[i]/energy,previous=widths[i];widths[i]+=(goal-widths[i])*ease;powers[i]+=(targets[i]-powers[i])*ease;p.style.width=widths[i]+'px';p.style.setProperty('--power',powers[i].toFixed(4));motion+=Math.abs(previous-widths[i])});
 positions=starts();if(!drag&&pointer===null)targetScroll=positions[active]+widths[active]/2-viewport.clientWidth/2;
 targetScroll=Math.max(0,Math.min(maxScroll(),targetScroll));const before=scroll;scroll+=(targetScroll-scroll)*ease;rail.style.transform=`translate3d(${-scroll}px,0,0)`;motion+=Math.abs(before-scroll);
 if(motion>.04||powers.some((p,i)=>Math.abs(p-targets[i])>.002))loop=requestAnimationFrame(tick);
}
viewport.addEventListener('pointermove',e=>{const rect=viewport.getBoundingClientRect();if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)){drag.moved=true;if(!viewport.hasPointerCapture(e.pointerId))viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging');pointer=viewport.clientWidth/2;targetScroll=drag.scroll-dx;wake()}}else if(e.pointerType==='mouse'){pointer=e.clientX-rect.left;wake()}});
viewport.addEventListener('pointerleave',()=>{if(!drag){pointer=null;wake()}});
viewport.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,scroll:targetScroll,moved:false,id:e.pointerId}});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;if(drag.moved)suppress=Date.now()+400;drag=null;pointer=null;viewport.classList.remove('dragging');if(viewport.hasPointerCapture(e.pointerId))viewport.releasePointerCapture(e.pointerId);wake()}
viewport.addEventListener('pointerup',endDrag);viewport.addEventListener('pointercancel',endDrag);
slider.addEventListener('input',()=>select(Number(slider.value)));
document.querySelector('#back').onclick=()=>select((active-1+photos.length)%photos.length);document.querySelector('#forward').onclick=()=>select((active+1)%photos.length);
function paintViewer(){const p=photos[active];document.querySelector('#large').src='../assets/photos/'+p[0];document.querySelector('#large').alt=p[2];document.querySelector('#viewer-title').textContent=p[1];document.querySelector('#viewer-count').textContent=`${String(active+1).padStart(2,'0')} / 09`}
function openViewer(){returnFocus=document.activeElement;paintViewer();dialog.showModal();document.body.style.overflow='hidden';document.querySelector('#close').focus()}
document.querySelector('#view').onclick=openViewer;document.querySelector('#close').onclick=()=>dialog.close();function modalStep(d){select((active+d+photos.length)%photos.length);paintViewer()};document.querySelector('#viewer-back').onclick=()=>modalStep(-1);document.querySelector('#viewer-next').onclick=()=>modalStep(1);dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();modalStep(e.key==='ArrowLeft'?-1:1)}});dialog.addEventListener('close',()=>{document.body.style.overflow='';if(returnFocus&&returnFocus.isConnected)returnFocus.focus()});
function resize(){const {base}=metrics();widths=panels.map(()=>base);powers=panels.map(()=>0);pointer=null;wake()};window.addEventListener('resize',resize);reduced.addEventListener('change',wake);resize();updateActive(0);
</script></body></html>
