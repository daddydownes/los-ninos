<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Niños — Split Screen</title><style>
@font-face{font-family:Barlow;src:url('../assets/fonts/barlow-condensed-800-latin.woff2')}@font-face{font-family:DM;src:url('../assets/fonts/dm-sans-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#08121d;color:#f1eee6;font-family:DM,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}header{padding:26px 5vw;display:flex;justify-content:space-between;font-size:10px;letter-spacing:1.5px}.brand{font:25px Barlow;letter-spacing:-.5px}.eyebrow{align-self:center;color:#9ba9b5}.intro{display:flex;align-items:end;justify-content:space-between;padding:18px 5vw 27px}h1{font:800 clamp(65px,10vw,145px)/.84 Barlow;margin:0;letter-spacing:-.025em}h1 span{color:#3978ff}.intro p{font-size:11px;line-height:1.6;max-width:140px;margin:0}.stage{height:min(60vh,650px);min-height:350px;position:relative;overflow:hidden;margin:0 5vw;background:#142331;--split:50%;isolation:isolate}.pane{position:absolute;inset:0;overflow:hidden}.pane img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.7)}.pane.left{clip-path:inset(0 calc(100% - var(--split)) 0 0)}.pane.right{clip-path:inset(0 0 0 var(--split))}.left img{object-position:35% 38%}.right img{object-position:65% 42%}.pane:after{content:'';position:absolute;inset:60% 0 0;background:linear-gradient(transparent,#08121d99);pointer-events:none}.pane-label{position:absolute;bottom:23px;z-index:2;left:22px;font:22px Barlow;letter-spacing:.3px}.right .pane-label{left:auto;right:22px;text-align:right}.pane-label small{display:block;font:8px DM;letter-spacing:1.7px;margin-bottom:5px}.divider{position:absolute;top:0;bottom:0;left:var(--split);width:2px;background:#f1eee6;z-index:5;pointer-events:none;transform:translateX(-50%)}.handle{position:absolute;top:50%;left:50%;width:64px;height:64px;transform:translate(-50%,-50%);border-radius:50%;background:#f1eee6;color:#08121d;display:flex;align-items:center;justify-content:center;gap:13px;box-shadow:0 4px 35px #0003;font-size:15px}.handle:after{content:'';position:absolute;left:50%;top:19px;bottom:19px;border-left:1px solid #08121d66}.range{position:absolute;z-index:6;inset:0;margin:0;opacity:0;width:100%;height:100%;cursor:ew-resize;touch-action:pan-y}.stage:focus-within .handle{outline:3px solid #3978ff;outline-offset:5px}.stage.hint .handle{animation:nudge 1.4s ease-in-out 2}.hint-copy{position:absolute;top:calc(50% + 50px);left:var(--split);transform:translateX(-50%);z-index:5;font-size:9px;letter-spacing:1.5px;white-space:nowrap;text-shadow:0 2px 8px #000;pointer-events:none}.stage.used .hint-copy{opacity:0;transition:opacity .3s}.actions{display:flex;justify-content:space-between;gap:10px;padding:17px 5vw}.view{background:transparent;border:0;border-bottom:1px solid #58616b;padding:5px 0;font-size:10px;letter-spacing:.7px}.pair-nav{display:flex;justify-content:space-between;align-items:center;margin:21px 5vw 30px;padding-top:18px;border-top:1px solid #33404b}.pair-title{font:27px Barlow}.pair-title span{font:9px DM;color:#8997a3;letter-spacing:1.3px;margin-left:13px}.next{background:#f1eee6;border:0;color:#08121d;border-radius:2px;padding:13px 18px;font-size:10px;letter-spacing:1px}.next span{margin-left:25px;font-size:16px}button:focus-visible{outline:2px solid #3978ff;outline-offset:4px}dialog{padding:0;border:0;background:#08121d;color:#f1eee6;width:100vw;height:100dvh;max-width:100vw;max-height:100dvh}dialog::backdrop{background:#08121d}dialog img{width:100%;height:100%;object-fit:contain;padding:45px 20px}dialog button{position:absolute;right:20px;top:20px;padding:10px 16px;background:#f1eee6;color:#08121d;border:0;z-index:2}.full-caption{position:absolute;bottom:15px;width:100%;text-align:center;font-size:10px;letter-spacing:1px}@keyframes nudge{0%,100%{transform:translate(-50%,-50%)}35%{transform:translate(-65%,-50%)}65%{transform:translate(-35%,-50%)}}@media(max-width:600px){header{padding:22px 6vw}.eyebrow{font-size:8px}.intro{padding:25px 6vw}.intro p{max-width:100px;font-size:9px}h1{font-size:68px}.stage{margin:0 5vw;height:52vh;min-height:360px}.pane img{object-position:center}.handle{width:54px;height:54px;gap:11px}.pane-label{left:12px;bottom:17px;font-size:17px}.right .pane-label{right:12px}.pane-label small{font-size:6px;letter-spacing:1px}.pair-title span{display:block;margin:4px 0 0;font-size:8px}.next{padding:12px;font-size:9px}.next span{margin-left:13px}.view{font-size:9px}}@media(prefers-reduced-motion:reduce){.stage.hint .handle{animation:none}.stage.used .hint-copy{transition:none}}
</style></head><body><header><div class="brand">LOS NIÑOS</div><div class="eyebrow">THE ARCHIVE / TWO SIDES</div></header><div class="intro"><h1>SPLIT<br>SCREEN<span>.</span></h1><p>Same world.<br>A different point of view.<br>Find your balance.</p></div><main><div class="stage hint" id="stage"><div class="pane left"><img id="leftImage" src="../assets/photos/portrait.webp" alt="Portrait of a man in a Los Niños cap"><div class="pane-label"><small>FRAME A</small><span id="leftTitle">THE PERSON</span></div></div><div class="pane right"><img id="rightImage" src="../assets/photos/hat-detail.webp" alt="Close-up of a Los Niños cap"><div class="pane-label"><small>FRAME B</small><span id="rightTitle">THE DETAILS</span></div></div><div class="divider"><div class="handle"><span>←</span><span>→</span></div></div><div class="hint-copy">SLIDE TO EXPLORE</div><input class="range" id="split" type="range" min="8" max="92" value="50" aria-label="Photo divider position" aria-valuetext="50 percent left photograph"></div><div class="actions"><button class="view" id="viewLeft">↗ View frame A</button><button class="view" id="viewRight">View frame B ↗</button></div><div class="pair-nav"><div class="pair-title"><b id="pairNumber">01</b> / 03<span id="pairLabel">PEOPLE & DETAILS</span></div><button class="next" id="next">NEXT PAIR <span>↗</span></button></div></main><dialog id="full"><button id="close">Close ×</button><img id="fullImage" alt=""><div class="full-caption" id="fullCaption"></div></dialog><script>
const pairs=[{files:['portrait.webp','hat-detail.webp'],titles:['THE PERSON','THE DETAILS'],alts:['Portrait of a man in a Los Niños cap','Close-up of a Los Niños cap'],label:'PEOPLE & DETAILS'},{files:['street.webp','caps.webp'],titles:['OUT THERE','RIGHT HERE'],alts:['White shirt against a street wall','Los Niños caps arranged on a flag'],label:'STREETS & COLOURS'},{files:['photo-17.webp','photo-27.webp'],titles:['SIDE A','SIDE B'],alts:['Los Niños archive photograph, frame A','Los Niños archive photograph, frame B'],label:'SOMEWHERE IN BETWEEN'}];let pair=0;const stage=document.querySelector('#stage'),range=document.querySelector('#split'),dialog=document.querySelector('#full');function update(){stage.style.setProperty('--split',range.value+'%');range.setAttribute('aria-valuetext',range.value+' percent left photograph');stage.classList.add('used');stage.classList.remove('hint')}range.addEventListener('input',update);document.querySelector('#next').addEventListener('click',()=>{pair=(pair+1)%pairs.length;['left','right'].forEach((side,i)=>{document.querySelector('#'+side+'Image').src='../assets/photos/'+pairs[pair].files[i];document.querySelector('#'+side+'Image').alt=pairs[pair].alts[i];document.querySelector('#'+side+'Title').textContent=pairs[pair].titles[i]});document.querySelector('#pairNumber').textContent=String(pair+1).padStart(2,'0');document.querySelector('#pairLabel').textContent=pairs[pair].label;range.value=50;update()});function full(i){document.querySelector('#fullImage').src='../assets/photos/'+pairs[pair].files[i];document.querySelector('#fullImage').alt=pairs[pair].alts[i];document.querySelector('#fullCaption').textContent=pairs[pair].titles[i];dialog.showModal()}document.querySelector('#viewLeft').addEventListener('click',()=>full(0));document.querySelector('#viewRight').addEventListener('click',()=>full(1));document.querySelector('#close').addEventListener('click',()=>dialog.close());
</script></body></html>
