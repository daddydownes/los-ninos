<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Los Niños — Ribbon archive</title>
<style>
@font-face{font-family:Barlow;src:url('../assets/fonts/barlow-condensed-800-latin.woff2')}@font-face{font-family:DM;src:url('../assets/fonts/dm-sans-latin.woff2')}
:root{--ink:#142939;--paper:#f3eddf;--muted:#a3afaF}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font-family:DM,sans-serif;overflow-x:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #d8b57a;outline-offset:7px}header{height:87px;margin:0 4%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff25}.brand{font:800 29px Barlow,sans-serif;letter-spacing:-.7px}.tag{font-size:10px;letter-spacing:2px;text-transform:uppercase}.edition{font-size:10px;letter-spacing:1.2px}.intro{padding:33px 4% 0;display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:2;pointer-events:none}h1{font:800 clamp(70px,11vw,160px)/.82 Barlow,sans-serif;text-transform:uppercase;letter-spacing:-.035em;margin:0}.intro p{font-size:12px;line-height:1.7;max-width:205px;margin:0 0 8px;color:#c1c7c7}.intro p span{display:block;font-size:9px;letter-spacing:2px;color:#e4c89d;margin-bottom:10px}.ribbon{height:480px;position:relative;touch-action:pan-y;cursor:grab;user-select:none;overflow:hidden;margin-top:-8px}.ribbon.dragging{cursor:grabbing}.path{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;opacity:.17}.print{position:absolute;left:50%;top:50%;width:234px;height:300px;padding:9px 9px 30px;background:var(--paper);border:0;box-shadow:0 22px 28px #07111c55;transform-origin:50% 50%;will-change:transform;cursor:inherit;color:var(--ink)}.print img{width:100%;height:100%;object-fit:cover;pointer-events:none}.print .number{position:absolute;bottom:9px;left:11px;font-size:9px;letter-spacing:1.1px}.print .mark{position:absolute;bottom:9px;right:12px;font-size:9px;letter-spacing:1px}.print.active{cursor:zoom-in}.focus-label{text-align:center;display:flex;justify-content:center;align-items:center;gap:15px;font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-top:-6px}.focus-label:before,.focus-label:after{content:'';height:1px;width:30px;background:#f3eddf40}.controls{margin:29px 4% 0;padding:19px 0;border-top:1px solid #ffffff25;display:flex;justify-content:space-between;align-items:center;gap:20px}.instruction{font-size:10px;color:#b6c1c6;letter-spacing:.3px}.instruction strong{font-weight:400;color:var(--paper)}.stepper{display:flex;gap:24px;align-items:center}.arrow{width:40px;height:40px;background:none;color:var(--paper);border:1px solid #ffffff40;border-radius:50%;font-size:20px}.arrow:hover{background:var(--paper);color:var(--ink)}.count{font-size:12px;font-variant-numeric:tabular-nums;min-width:68px;text-align:center}.count span{color:#87969f}.open{border:0;border-bottom:1px solid #e4c89d;background:none;color:var(--paper);padding:7px 0;font-size:10px;letter-spacing:1px}.foot{margin:5px 4% 25px;display:flex;justify-content:space-between;font-size:9px;letter-spacing:1.3px;color:#87969f;text-transform:uppercase}dialog{border:0;padding:54px 24px 24px;background:#102432;color:var(--paper);max-width:94vw;max-height:94dvh;box-shadow:0 0 0 1px #ffffff25}dialog::backdrop{background:#060f18e8}dialog img{display:block;max-width:85vw;max-height:73dvh;object-fit:contain}.close{position:absolute;right:18px;top:12px;border:0;background:none;color:var(--paper);font-size:12px;padding:8px}.viewer-caption{font-size:10px;letter-spacing:1px;margin-top:14px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(min-width:1500px){.ribbon{height:550px}.print{width:260px;height:335px}}@media(max-width:650px){header{height:70px}.tag{display:none}.intro{padding-top:34px;display:block}.intro p{font-size:11px;margin:21px 0 0;max-width:250px}.intro p span{display:none}.ribbon{height:390px;margin-top:-6px}.print{width:192px;height:254px}.controls{margin-top:22px;flex-wrap:wrap;gap:14px}.instruction{width:100%;text-align:center;order:3;padding-top:8px}.stepper{gap:15px}.foot{margin-top:14px}.foot span:last-child{display:none}h1{font-size:24vw}}
</style>
</head>
<body>
<header><div class="brand">LOS NIÑOS</div><div class="tag">An ongoing photo archive</div><div class="edition">INDEX / 027</div></header>
<main><div class="intro"><h1>Life in<br>the loop.</h1><p><span>THE RIBBON COLLECTION</span>A little of everything.<br>Follow the photos. Find your frame.</p></div>
<section class="ribbon" id="ribbon" aria-label="Draggable photo ribbon. Use left and right arrow keys to browse." tabindex="0"><svg class="path" viewBox="0 0 1440 480" preserveAspectRatio="none" aria-hidden="true"><path d="M-100 155 C250 490 420 -80 720 240 S1190 20 1540 325" fill="none" stroke="#e9d8b8" stroke-width="1"/></svg></section>
<div class="focus-label">A moment in the middle</div>
<div class="controls"><div class="instruction"><strong>DRAG TO WANDER</strong> &nbsp; / &nbsp; Select the centre print to look closer</div><div class="stepper"><button class="arrow" id="prev" aria-label="Previous photo">←</button><div class="count"><b id="current">01</b> <span>/ 43</span></div><button class="arrow" id="next" aria-label="Next photo">→</button></div><button class="open" id="open">OPEN FRAME ↗</button></div>
<div class="foot"><span>Los Niños / The photo room</span><span>Keep moving. Come back around.</span></div><p class="sr-only" aria-live="polite" id="status"></p></main>
<dialog id="viewer" aria-label="Full photo"><button class="close" id="close">CLOSE ✕</button><img id="full" alt=""><div class="viewer-caption" id="caption"></div></dialog>
<script>
const files=['portrait.webp','street.webp','hat-detail.webp','caps.webp',...Array.from({length:39},(_,i)=>`photo-${String(i+1).padStart(2,'0')}.webp`)];
const ribbon=document.querySelector('#ribbon'),viewer=document.querySelector('#viewer'),reduced=matchMedia('(prefers-reduced-motion: reduce)');let position=0,target=0,dragging=false,startX=0,startPosition=0,distance=0,frame=0,active=0;
const mod=n=>(n%files.length+files.length)%files.length;
const prints=files.map((file,i)=>{let b=document.createElement('button');b.className='print';b.setAttribute('aria-label',`Open photo ${i+1}`);b.innerHTML=`<img src="../assets/photos/${file}" alt="Los Niños photo archive, frame ${String(i+1).padStart(2,'0')}" draggable="false"><span class="number">LN / ${String(i+1).padStart(2,'0')}</span><span class="mark">↗</span>`;b.addEventListener('click',()=>{if(distance>7)return;if(active===i)openPhoto();else{let d=mod(i-position+files.length/2)-files.length/2;go(position+d)}});ribbon.append(b);return b});
function render(){const spacing=innerWidth<650?176:225;active=mod(Math.round(position));prints.forEach((b,i)=>{let d=mod(i-position+files.length/2)-files.length/2;let x=d*spacing,y=Math.sin(d*.79)*90,scale=1-.12*Math.min(Math.abs(d),2.8),angle=Math.cos(d*.79)*10-10;let visible=Math.abs(x)<innerWidth/2+300;b.style.visibility=visible?'visible':'hidden';b.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) rotate(${angle}deg) scale(${scale})`;b.style.zIndex=String(100-Math.round(Math.abs(d)*10));b.classList.toggle('active',i===active);b.tabIndex=i===active?0:-1;b.setAttribute('aria-hidden',String(!visible));});document.querySelector('#current').textContent=String(active+1).padStart(2,'0')}
function animate(){frame=0;position+=(target-position)*.14;if(Math.abs(target-position)<.001)position=target;render();if(position!==target)frame=requestAnimationFrame(animate)}
function go(n){target=Math.round(n);cancelAnimationFrame(frame);if(reduced.matches){position=target;render()}else frame=requestAnimationFrame(animate);document.querySelector('#status').textContent=`Photo ${mod(target)+1} of ${files.length}`}
function openPhoto(){const img=document.querySelector('#full');img.src='../assets/photos/'+files[active];img.alt=`Los Niños archive photo ${active+1}`;document.querySelector('#caption').textContent=`LOS NIÑOS — FRAME ${String(active+1).padStart(2,'0')} / 43`;viewer.showModal()}
ribbon.addEventListener('pointerdown',e=>{if(e.button!==0)return;cancelAnimationFrame(frame);dragging=true;startX=e.clientX;startPosition=position;distance=0;ribbon.classList.add('dragging')});
ribbon.addEventListener('pointermove',e=>{if(!dragging)return;distance=Math.max(distance,Math.abs(e.clientX-startX));if(distance>7&&!ribbon.hasPointerCapture(e.pointerId))ribbon.setPointerCapture(e.pointerId);position=startPosition-(e.clientX-startX)/(innerWidth<650?176:225);target=position;render()});
function release(){if(!dragging)return;dragging=false;ribbon.classList.remove('dragging');go(position)}
ribbon.addEventListener('pointerup',release);ribbon.addEventListener('pointercancel',release);window.addEventListener('pointerup',release);
document.querySelector('#prev').onclick=()=>go(target-1);document.querySelector('#next').onclick=()=>go(target+1);document.querySelector('#open').onclick=openPhoto;document.querySelector('#close').onclick=()=>viewer.close();viewer.addEventListener('click',e=>{if(e.target===viewer){const r=viewer.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)viewer.close()}});
document.addEventListener('keydown',e=>{if(viewer.open)return;if(e.key==='ArrowRight'){e.preventDefault();go(target+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(target-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(files.length-1)}else if(e.key==='Enter'&&e.target===ribbon)openPhoto()});window.addEventListener('resize',render);render();
</script>
</body></html>
