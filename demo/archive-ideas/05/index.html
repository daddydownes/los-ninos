<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Los Niños — The Edition</title>
<style>
@font-face{font-family:Barlow;src:url('../assets/fonts/barlow-condensed-800-latin.woff2') format('woff2');font-weight:800;font-display:swap}@font-face{font-family:DM;src:url('../assets/fonts/dm-sans-latin.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--paper:#f1eee6;--ink:#08121d;--blue:#204dd8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:DM,Arial,sans-serif}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--blue);outline-offset:6px}::selection{background:#204dd8;color:white}.shell{max-width:1600px;margin:auto;padding:28px 5vw 26px}.mast{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #08121d33;padding-bottom:18px}.brand{font-family:Barlow,sans-serif;font-size:29px;line-height:.85;letter-spacing:-1px}.brand span{display:block}.micro{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;font-weight:600}.mast .micro{color:#6a6b66}.mast-right{display:flex;align-items:center;gap:28px}.blue-dot{width:7px;height:7px;background:var(--blue);border-radius:50%;display:inline-block;margin-right:8px}.heading{display:flex;justify-content:space-between;align-items:end;margin:23px 0 27px}.eyebrow{color:var(--blue);margin-bottom:9px}.heading h1{font-family:Barlow,sans-serif;font-size:clamp(65px,7vw,104px);line-height:.82;letter-spacing:-2px;margin:0;font-weight:800}.intro{max-width:230px;font-size:12px;line-height:1.55;margin:0 0 2px}.stage{position:relative;max-width:1050px;margin:0 auto;perspective:2000px;padding:0 0 10px}.book{height:min(51vw,540px);position:relative;isolation:isolate;touch-action:pan-y;background:#d3d0c6;box-shadow:0 22px 28px -22px #08121d88,0 1px 3px #08121d22}.book:before,.book:after{content:'';position:absolute;left:2px;right:2px;height:7px;bottom:-7px;z-index:-1;background:repeating-linear-gradient(to bottom,#b9b6ac 0px,#e4e0d5 1px,#e4e0d5 2px);border:1px solid #bbb7ab}.book:after{left:6px;right:6px;bottom:-10px;height:3px}.slot{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}.slot.left{left:0}.slot.right{right:0}.page{position:relative;height:100%;width:100%;background:#ede9df;overflow:hidden}.page img{width:100%;height:100%;object-fit:cover;display:block}.page.inset{padding:28px 33px 43px}.page.inset img{height:calc(100% - 37px);object-position:center 38%;filter:grayscale(1)}.page.inset .caption{position:static;color:var(--ink);display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:9px;letter-spacing:1px}.caption{position:absolute;left:28px;bottom:24px;color:white;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;z-index:2}.page.full:after{position:absolute;content:'';bottom:0;left:0;right:0;height:20%;background:linear-gradient(transparent,#0006)}.page .folio{position:absolute;right:25px;bottom:22px;font-size:10px;color:white;z-index:2}.page.inset .folio{bottom:15px;color:var(--ink)}.page.type{padding:35px;display:flex;flex-direction:column;justify-content:space-between;background:var(--ink);color:var(--paper)}.page.type h2{font:800 clamp(40px,6vw,88px)/.88 Barlow;margin:20px 0;letter-spacing:-1px}.page.type img{height:44%;object-fit:contain}.page.type .folio{bottom:18px}.spine{position:absolute;top:0;bottom:0;left:50%;width:36px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#00000014 38%,#0000003b 49%,#fff4 51%,#00000010 62%,transparent);z-index:4;pointer-events:none}.corner{position:absolute;right:0;bottom:0;width:47px;height:47px;border:0;background:linear-gradient(135deg,transparent 49%,#e6e0d0 50%,#fbf8ef 74%);cursor:pointer;z-index:6;transition:width .2s,height .2s;filter:drop-shadow(-2px -2px 2px #0002)}.corner:hover{width:60px;height:60px}.corner[disabled]{display:none}.corner span{position:absolute;right:6px;bottom:5px;font-size:18px}.leaf{position:absolute;top:0;bottom:0;width:50%;left:50%;transform-origin:left center;transform-style:preserve-3d;z-index:5}.leaf.reverse{left:0;transform-origin:right center}.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}.leaf .back{transform:rotateY(180deg)}.leaf .face:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0003,transparent 30%,#fff2)}.leaf.turn{animation:turn .85s cubic-bezier(.3,.05,.2,1) forwards}.leaf.reverse.turn{animation-name:reverseTurn}@keyframes turn{to{transform:rotateY(-180deg)}}@keyframes reverseTurn{to{transform:rotateY(180deg)}}.controls{max-width:1050px;margin:24px auto 0;display:flex;align-items:center;justify-content:space-between}.navigation{display:flex;align-items:center;gap:15px}.navigation button{background:none;border:1px solid #08121d40;width:39px;height:39px;border-radius:50%;font-size:21px;cursor:pointer;transition:background .2s,color .2s}.navigation button:hover:enabled{background:var(--ink);color:var(--paper)}.navigation button:disabled{opacity:.25;cursor:default}.counter{font-size:11px;font-variant-numeric:tabular-nums;min-width:65px;text-align:center}.progress{display:flex;gap:5px}.tick{width:23px;height:2px;background:#08121d25;transition:background .3s}.tick.active{background:var(--blue)}.hint{font-size:10px;color:#73746e}.foot{border-top:1px solid #08121d25;padding-top:15px;margin-top:27px;display:flex;justify-content:space-between;align-items:center}.foot p{margin:0;font-size:10px;color:#666b69}.foot .micro{font-size:9px}.mobile-hint{display:none}
@media(min-width:1500px){.stage{max-width:1130px}.book{height:580px}.controls{max-width:1130px}}
@media(max-width:650px){.shell{padding:21px 20px 22px}.mast{padding-bottom:15px}.brand{font-size:24px}.mast-right{gap:0}.mast-right>span:first-child{display:none}.mast .micro{font-size:8px;letter-spacing:1px}.heading{margin:25px 0 22px;display:block}.heading h1{font-size:65px;letter-spacing:-1.5px}.eyebrow{font-size:9px;margin-bottom:11px}.intro{font-size:11px;line-height:1.5;max-width:255px;margin:16px 0 0}.book{height:auto;aspect-ratio:335/455}.slot{width:100%}.slot.left{display:none}.spine{display:none}.page.inset{padding:20px 21px 39px}.page.inset img{height:calc(100% - 27px)}.page.inset .caption{font-size:8px;margin-top:12px}.caption{left:20px;bottom:20px;font-size:9px}.leaf,.leaf.reverse{left:0;width:100%;transform-origin:left center}.leaf.reverse{transform-origin:right center}.page.type{padding:26px}.page.type h2{font-size:70px}.controls{margin-top:23px}.hint{display:none}.mobile-hint{display:inline;font-size:9px;color:#73746e}.navigation{gap:9px}.navigation button{width:35px;height:35px}.counter{min-width:42px;font-size:10px}.progress{gap:4px}.tick{width:10px}.foot{margin-top:24px;gap:15px;align-items:start}.foot p{font-size:9px;max-width:160px;line-height:1.5}.foot .micro{font-size:8px;line-height:1.5;text-align:right}.corner{width:40px;height:40px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell">
<header class="mast"><div class="brand" aria-label="Los Niños">LOS<span>NIÑOS</span></div><div class="mast-right"><span class="micro">Independent by nature</span><span class="micro"><i class="blue-dot"></i>Objects & everyday life</span></div></header>
<section aria-labelledby="title"><div class="heading"><div><div class="eyebrow micro">The photographic archive / No. 001</div><h1 id="title">THE EDITION.</h1></div><p class="intro">A few faces. Familiar places.<br>A collection of moments, bound together.</p></div>
<div class="stage"><div class="book" id="book" aria-label="Photographic lookbook"><div class="slot left" id="left"></div><div class="slot right" id="right"></div><div class="spine"></div><button class="corner" id="corner" aria-label="Turn to next page"><span>↗</span></button></div></div>
<div class="controls"><span class="hint">Click the corner. Stay a while.</span><span class="mobile-hint">Swipe to turn</span><div class="progress" id="progress" aria-hidden="true"></div><div class="navigation"><button id="prev" aria-label="Previous page">←</button><span class="counter" id="counter" aria-live="polite"></span><button id="next" aria-label="Next page">→</button></div></div>
</section><footer class="foot"><p>Made for the days that become stories.</p><span class="micro">Los Niños<br>Always in good company.</span></footer>
</main>
<script>
const pages=[
{img:'portrait.webp',alt:'Black and white portrait in a Los Niños cap',kind:'inset',label:'01 / The familiar faces',note:'Los Niños'},
{img:'street.webp',alt:'A man in a white shirt standing in sun and shadow',kind:'full',label:'Out in the everyday'},
{img:'hat-detail.webp',alt:'A close view of the Los Niños cap',kind:'full',label:'A closer look'},
{img:'caps.webp',alt:'Los Niños caps photographed together',kind:'inset',label:'02 / Objects with character',note:'The essentials'},
{img:'photo-05.webp',alt:'A photograph from the Los Niños archive',kind:'inset',label:'03 / Collected moments',note:'In good company'},
{img:'photo-08.webp',alt:'A moment from the Los Niños photographic archive',kind:'full',label:'Nothing out of the ordinary'},
{img:'photo-12.webp',alt:'A photograph from the Los Niños lookbook',kind:'full',label:'The days in between'},
{img:'caps.webp',alt:'The Los Niños cap collection',kind:'type',label:'Until the next chapter.'}
];
const book=document.getElementById('book'),left=document.getElementById('left'),right=document.getElementById('right'),prev=document.getElementById('prev'),next=document.getElementById('next'),corner=document.getElementById('corner'),counter=document.getElementById('counter'),progress=document.getElementById('progress');
const mq=matchMedia('(max-width:650px)'),reduce=matchMedia('(prefers-reduced-motion:reduce)');let index=0,busy=false,startX=0,startY=0;
function markup(i){const p=pages[i];if(!p)return '';const n=String(i+1).padStart(2,'0');if(p.kind==='type')return `<article class="page type"><span class="micro">Los Niños / The edition</span><h2>GOOD DAYS.<br>GOOD<br>COMPANY.</h2><img src="../assets/photos/${p.img}" alt="${p.alt}"><span class="micro">${p.label}</span><span class="folio">${n}</span></article>`;return `<article class="page ${p.kind}"><img src="../assets/photos/${p.img}" alt="${p.alt}" draggable="false"><div class="caption"><span>${p.label}</span>${p.note?`<span>${p.note}</span>`:''}</div><span class="folio">${n}</span></article>`}
function render(){const step=mq.matches?1:2;left.innerHTML=mq.matches?'':markup(index);right.innerHTML=markup(index+(mq.matches?0:1));counter.textContent=mq.matches?`${String(index+1).padStart(2,'0')} / 08`:`${String(index+1).padStart(2,'0')}—${String(index+2).padStart(2,'0')}`;prev.disabled=index===0;next.disabled=corner.disabled=index+step>=pages.length;progress.innerHTML=Array.from({length:pages.length/step},(_,i)=>`<span class="tick ${i===Math.floor(index/step)?'active':''}"></span>`).join('');}
function turn(direction){const step=mq.matches?1:2,target=index+direction*step;if(busy||target<0||target>=pages.length)return;if(reduce.matches){index=target;render();return}busy=true;prev.disabled=next.disabled=corner.disabled=true;const leaf=document.createElement('div');leaf.className='leaf'+(direction<0?' reverse':'');let front,back;if(mq.matches){front=index;back=target;right.innerHTML=markup(target)}else if(direction>0){front=index+1;back=target;right.innerHTML=markup(target+1)}else{front=index;back=target+1;left.innerHTML=markup(target)}leaf.innerHTML=`<div class="face front">${markup(front)}</div><div class="face back">${markup(back)}</div>`;book.appendChild(leaf);let done=false;function finish(){if(done)return;done=true;index=target;leaf.remove();busy=false;render()}leaf.addEventListener('animationend',finish,{once:true});requestAnimationFrame(()=>requestAnimationFrame(()=>leaf.classList.add('turn')));setTimeout(finish,1050)}
prev.addEventListener('click',()=>turn(-1));next.addEventListener('click',()=>turn(1));corner.addEventListener('click',()=>turn(1));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();turn(1)}if(e.key==='ArrowLeft'){e.preventDefault();turn(-1)}});book.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});book.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)turn(dx<0?1:-1)});mq.addEventListener('change',()=>{if(!mq.matches)index=Math.floor(index/2)*2;render()});render();pages.forEach(p=>{const img=new Image();img.src='../assets/photos/'+p.img});
</script>
</body></html>
