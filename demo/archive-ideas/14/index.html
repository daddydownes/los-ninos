</style></head><body><main class="shell"><header class="mast"><div class="logo" aria-label="Los Niños">LOS<span>NIÑOS</span></div><span class="micro"><i class="dot"></i>A collection of everyday life</span></header><section aria-labelledby="title"><div class="heading"><div><div class="micro eyebrow">From the photographic archive</div><h1 id="title">A LITTLE CLOSER.</h1></div><p class="intro">The people. The places. The in-between.<br>Pick a moment. Make yourself at home.</p></div><div class="fan-stage" id="fan" aria-label="Endless photograph fan. Drag or scroll sideways to browse, or select a card to enlarge."></div><div class="interaction"><div class="drag-cue"><span class="arrows" aria-hidden="true">↔</span><div>Drag or scroll. Keep going.<small>Tap to take a closer look.</small></div></div><div class="selection" aria-live="polite"><p id="selectedTitle"></p><span class="micro" id="selectedCount"></span></div><div class="controls"><button class="arrow" id="prev" aria-label="Previous photograph">←</button><button class="arrow" id="next" aria-label="Next photograph">→</button><button class="open" id="open">Take a look ↗</button></div></div></section><footer class="footer"><span>Good days. Better company.</span><span class="micro">Los Niños / A life well collected</span></footer></main><dialog id="viewer" aria-labelledby="detailTitle"><div class="detail"><div class="detail-image"><img id="detailImg" alt=""></div><div class="detail-info"><button class="close" id="close">Back to the collection ×</button><span class="micro" id="detailCategory"></span><h2 id="detailTitle"></h2><p id="detailCopy"></p><div class="detail-nav"><span id="detailCount"></span><button class="arrow" id="detailPrev" aria-label="Previous photograph">←</button><button class="arrow" id="detailNext" aria-label="Next photograph">→</button></div></div></div></dialog><script>
const photos=[{file:'photo-01.webp',title:'The days in between',category:'Collected moments',copy:'The little things that make their way into the archive.'},{file:'hat-detail.webp',title:'All in the details',category:'A closer look',copy:'Familiar shapes. A little character. Everyday essentials, seen up close.'},{file:'portrait.webp',title:'Familiar faces',category:'In good company',copy:'Some things look better with a little life in them.'},{file:'street.webp',title:'Out in the everyday',category:'Somewhere along the way',copy:'A patch of sunshine. A quiet street. No particular place to be.'},{file:'caps.webp',title:'A few favourites',category:'Objects with character',copy:'The pieces we reach for, day after day.'},{file:'photo-08.webp',title:'Nothing ordinary',category:'Collected moments',copy:'A moment worth keeping. Another page in the Los Niños story.'},{file:'photo-12.webp',title:'Until next time',category:'The ongoing archive',copy:'Always a little more to see. Always in good company.'}];
photos.push(...Array.from({length:39},(_,i)=>i+1).filter(n=>![1,8,12].includes(n)).map(n=>({file:`photo-${String(n).padStart(2,'0')}.webp`,title:`Collected moment ${String(n).padStart(2,'0')}`,category:'The ongoing archive',copy:'A little more of everyday life. Keep moving. Come back around.'})));
const mod=n=>(n%photos.length+photos.length)%photos.length;
const fan=document.getElementById('fan'),viewer=document.getElementById('viewer'),prev=document.getElementById('prev'),next=document.getElementById('next');
const reduced=matchMedia('(prefers-reduced-motion:reduce)'),clamp=(v,min=0,max=photos.length-1)=>Math.max(min,Math.min(max,v));
let active=3,position=3,velocity=0,target=3,drag=null,frame=0,lastFrame=0,wheelTimer=0,lastWheel=0;
const cards=photos.map((p,i)=>{const b=document.createElement('button');b.className='card';b.dataset.index=i;b.setAttribute('aria-label',`Enlarge photograph: ${p.title}`);b.innerHTML=`<img src="../assets/photos/${p.file}" alt="${p.title}" draggable="false"><span class="number">${String(i+1).padStart(2,'0')}</span><span class="card-label">Los Niños / Archive</span>`;fan.appendChild(b);b.addEventListener('click',e=>{if(e.detail===0){select(position+mod(i-position+photos.length/2)-photos.length/2);openViewer()}});return b});
function travel(){return innerWidth<=700?105:170}
function arrange(){const mobile=innerWidth<=700,energy=reduced.matches?0:Math.min(Math.abs(velocity)/9,1),spread=(mobile?58:115)+energy*(mobile?9:18);cards.forEach((c,i)=>{const d=mod(i-position+photos.length/2)-photos.length/2,near=Math.exp(-d*d*1.25),dx=d*spread,y=(Math.sqrt(d*d+.15)-Math.sqrt(.15))*(mobile?18:20)-near*10,angle=d*(mobile?8:9)-clamp(velocity,-10,10)*.65,scale=1-Math.min(Math.abs(d),8)*.023,z=near*20,visible=Math.abs(dx)<fan.clientWidth/2+300;c.style.visibility=visible?'visible':'hidden';c.style.transform=`translateX(calc(-50% + ${dx}px)) translateY(${y}px) translateZ(${z}px) rotate(${angle}deg) scale(${scale})`;c.style.zIndex=String(100-Math.round(Math.abs(d)*15));c.style.boxShadow=`0 2px 4px #08121d20, 0 ${12+near*14}px ${20+near*15}px -12px rgba(8,18,29,${.25+near*.2})`;c.classList.toggle('active',i===mod(Math.round(position)));c.setAttribute('aria-current',i===mod(Math.round(position))?'true':'false');c.setAttribute('aria-hidden',String(!visible));c.tabIndex=i===mod(Math.round(position))?0:-1});if(!viewer.open)setActive(mod(Math.round(position)))}
function setActive(i){active=mod(Math.round(i));document.getElementById('selectedTitle').textContent=photos[active].title;document.getElementById('selectedCount').textContent=`${String(active+1).padStart(2,'0')} / ${photos.length}`;prev.disabled=false;next.disabled=false}
function stopMotion(){cancelAnimationFrame(frame);frame=0;lastFrame=0;clearTimeout(wheelTimer);wheelTimer=0}
function spring(time){const dt=lastFrame?Math.min((time-lastFrame)/1000,.032):1/60;lastFrame=time;velocity+=((target-position)*125-velocity*19)*dt;position+=velocity*dt;arrange();if(Math.abs(position-target)<.0008&&Math.abs(velocity)<.008){position=target;velocity=0;frame=0;lastFrame=0;arrange();return}frame=requestAnimationFrame(spring)}
function settle(project=true){clearTimeout(wheelTimer);wheelTimer=0;target=Math.round(position+(project?velocity*.16:0));if(reduced.matches){position=target;velocity=0;arrange();return}cancelAnimationFrame(frame);lastFrame=0;frame=requestAnimationFrame(spring)}
function select(i){stopMotion();target=Math.round(i);setActive(target);if(viewer.open)fillViewer();if(reduced.matches){position=target;velocity=0;arrange()}else{velocity=0;frame=requestAnimationFrame(spring)}}
function fillViewer(){const p=photos[active],img=document.getElementById('detailImg');img.src='../assets/photos/'+p.file;img.alt=p.title;document.getElementById('detailTitle').textContent=p.title;document.getElementById('detailCategory').textContent=p.category;document.getElementById('detailCopy').textContent=p.copy;document.getElementById('detailCount').textContent=`${String(active+1).padStart(2,'0')} / ${photos.length}`;document.getElementById('detailPrev').disabled=false;document.getElementById('detailNext').disabled=false}
function openViewer(){fillViewer();viewer.showModal();document.body.style.overflow='hidden'}viewer.addEventListener('close',()=>{document.body.style.overflow='';arrange()});document.getElementById('close').onclick=()=>viewer.close();viewer.addEventListener('click',e=>{if(e.target===viewer){const r=viewer.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)viewer.close()}});prev.onclick=()=>select(Math.round(target)-1);next.onclick=()=>select(Math.round(target)+1);document.getElementById('detailPrev').onclick=()=>select(Math.round(target)-1);document.getElementById('detailNext').onclick=()=>select(Math.round(target)+1);document.getElementById('open').onclick=openViewer;
fan.addEventListener('pointerdown',e=>{if(e.button!==0)return;stopMotion();velocity=0;drag={x:e.clientX,y:e.clientY,id:e.pointerId,card:e.target.closest('.card'),origin:position,lastX:e.clientX,lastTime:performance.now(),dx:0,horizontal:false};fan.setPointerCapture(e.pointerId);fan.classList.add('dragging')});
function moveDrag(e){if(!drag||drag.id!==e.pointerId)return;const now=performance.now();drag.dx=e.clientX-drag.x;const dy=e.clientY-drag.y;if(!drag.horizontal&&Math.abs(drag.dx)>7&&Math.abs(drag.dx)>Math.abs(dy))drag.horizontal=true;if(!drag.horizontal)return;const moved=e.clientX-drag.lastX;if(moved!==0){const dt=Math.max((now-drag.lastTime)/1000,.008),instant=-moved/travel()/dt;velocity=clamp(velocity*.35+instant*.65,-12,12);drag.lastX=e.clientX;drag.lastTime=now}position=drag.origin-drag.dx/travel();target=position;arrange()}
fan.addEventListener('pointermove',moveDrag);
function endDrag(e,cancel=false){if(!drag)return;if(!cancel)moveDrag(e);const d=drag;drag=null;fan.classList.remove('dragging');if(fan.hasPointerCapture(e.pointerId))fan.releasePointerCapture(e.pointerId);if(cancel){velocity=0;settle(false);return}if(d.horizontal){if(performance.now()-d.lastTime>90)velocity=0;settle()}else if(d.card&&Math.abs(d.dx)<8&&Math.abs(e.clientY-d.y)<12){const i=Number(d.card.dataset.index);select(position+mod(i-position+photos.length/2)-photos.length/2);openViewer()}else{velocity=0;settle(false)}}fan.addEventListener('pointerup',e=>endDrag(e));fan.addEventListener('pointercancel',e=>endDrag(e,true));window.addEventListener('pointerup',e=>endDrag(e));
fan.addEventListener('wheel',e=>{if(e.ctrlKey||drag)return;const horizontal=Math.abs(e.deltaX)>Math.abs(e.deltaY),shifted=e.shiftKey&&Math.abs(e.deltaY)>0;if(!horizontal&&!shifted)return;e.preventDefault();cancelAnimationFrame(frame);frame=0;lastFrame=0;clearTimeout(wheelTimer);const unit=e.deltaMode===1?16:e.deltaMode===2?fan.clientWidth:1,delta=(horizontal?e.deltaX:e.deltaY)*unit,now=performance.now(),dt=Math.max(Math.min((now-lastWheel)/1000,.05),.008);lastWheel=now;const before=position;position+=delta/travel();target=position;velocity=clamp(velocity*.45+(position-before)/dt*.55,-10,10);arrange();wheelTimer=setTimeout(()=>settle(),120)},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();select(Math.round(target)+(e.key==='ArrowRight'?1:-1))}});window.addEventListener('resize',()=>arrange());reduced.addEventListener('change',()=>{if(reduced.matches){stopMotion();position=Math.round(position);velocity=0;target=position;arrange()}});arrange();
</script></body></html>
