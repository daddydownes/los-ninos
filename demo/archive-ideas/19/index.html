<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Niños — Photo Wheel</title><style>
@font-face{font-family:Barlow;src:url('../assets/fonts/barlow-condensed-800-latin.woff2')}@font-face{font-family:DM;src:url('../assets/fonts/dm-sans-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#f1eee6;color:#08121d;font-family:DM,Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,.wheel:focus-visible{outline:3px solid #3155da;outline-offset:5px}header{margin:0 4vw;border-bottom:1px solid #08121d33;padding:20px 0;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.12em}.brand{font-family:Barlow;font-size:25px;letter-spacing:-.02em}.intro{padding:35px 4vw 0;display:flex;align-items:end;justify-content:space-between}.kicker{font-size:10px;color:#3155da;letter-spacing:.15em;margin-bottom:12px}h1{font-family:Barlow;font-size:clamp(65px,9vw,135px);line-height:.88;letter-spacing:-.02em;margin:0}.intro p{font-size:12px;line-height:1.7;margin:0 0 4px}.wheel{height:560px;position:relative;overflow:hidden;touch-action:pan-y;cursor:grab;outline:none;margin-top:30px;user-select:none}.wheel.dragging{cursor:grabbing}.rotor{position:absolute;left:50%;top:570px;width:0;height:0;transform:rotate(var(--rotation,0deg));will-change:transform}.print{position:absolute;left:-115px;top:-150px;width:230px;height:300px;background:#faf9f4;padding:9px 9px 0;box-shadow:0 3px 5px #08121d20,0 12px 22px #08121d24;transform:rotate(var(--angle)) translateY(-385px);border:0;text-align:left;pointer-events:none}.print img{width:100%;height:258px;object-fit:cover;display:block;pointer-events:none;filter:saturate(.85)}.print span{font-size:9px;display:flex;justify-content:space-between;height:33px;align-items:center;letter-spacing:.05em}.print.active{box-shadow:0 3px 4px #08121d20,0 15px 30px #08121d35}.print.active:after{content:'';position:absolute;left:calc(50% - 4px);top:-18px;background:#3155da;width:8px;height:8px;border-radius:50%}.arc{position:absolute;width:740px;height:740px;border:1px dashed #08121d25;border-radius:50%;left:50%;top:200px;transform:translateX(-50%);pointer-events:none}.pivot{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:125px;width:125px;background:#f1eee6;border:1px solid #08121d35;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Barlow;font-size:21px;box-shadow:0 0 0 12px #f1eee6;pointer-events:none}.pivot:before{content:'';position:absolute;top:13px;width:1px;height:15px;background:#3155da}.cue{position:absolute;bottom:22px;left:4vw;font-size:10px;line-height:1.8;letter-spacing:.03em;pointer-events:none}.cue b{font-size:23px;display:block;font-weight:400;color:#3155da}.rail{margin:0 4vw;border-top:1px solid #08121d33;padding:20px 0 25px;display:flex;justify-content:space-between;gap:20px;align-items:center}.caption{font-size:14px}.caption small{display:block;font-size:9px;letter-spacing:.12em;color:#08121d88;margin-top:8px}.actions{display:flex;align-items:center;gap:8px}.actions button{height:44px;min-width:44px;border:1px solid #08121d50;background:transparent;font-size:18px}.actions button:hover{background:#08121d;color:#f1eee6}.actions #view{font-size:11px;padding:0 20px;background:#08121d;color:#f1eee6;margin-left:10px}.count{font-size:10px;letter-spacing:.08em;padding:0 7px}.sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}dialog{width:100vw;height:100dvh;max-width:100%;max-height:100%;border:0;margin:0;padding:25px 4vw;background:#08121df7;color:#f1eee6}dialog::backdrop{background:#08121d}.dialog-head{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.1em}.dialog-head button{background:transparent;border:1px solid #f1eee670;color:#f1eee6;padding:10px 17px}dialog img{width:100%;height:calc(100% - 100px);object-fit:contain;margin:18px 0}dialog p{font-size:11px;margin:0}@media(max-width:650px){header{padding:16px 0}.intro{display:block;padding-top:27px}h1{font-size:16.6vw}.intro p{font-size:10px;margin-top:17px}.wheel{height:430px;margin-top:23px}.rotor{top:445px}.print{width:172px;height:224px;left:-86px;top:-112px;padding:7px 7px 0;transform:rotate(var(--angle)) translateY(-305px)}.print img{height:190px}.print span{font-size:8px;height:27px}.arc{width:590px;height:590px;top:150px}.pivot{width:90px;height:90px;font-size:17px}.cue{bottom:10px;font-size:9px;max-width:110px}.cue b{font-size:18px}.rail{align-items:start;flex-direction:column;gap:18px;padding-top:16px}.actions{width:100%;justify-content:space-between}.actions #view{margin-left:auto}.caption{font-size:12px}.kicker{font-size:9px}.print.active:after{top:-14px;width:6px;height:6px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header><span class="brand">LOS NIÑOS</span><span>ARCHIVE STUDY / 19</span></header><main><div class="intro"><div><div class="kicker">A DIFFERENT WAY THROUGH</div><h1>PHOTO WHEEL</h1></div><p>A turn of the hand.<br>A new frame in view.</p></div><section class="wheel" tabindex="0" role="region" aria-label="Photo wheel. Drag sideways or use left and right arrows. Enter opens selected photo."><div class="arc"></div><div class="rotor"></div><div class="pivot">L / N</div><div class="cue"><b>← &nbsp; →</b>DRAG TO TURN<br>Arrow keys work, too.</div></section><div class="rail"><div class="caption"><span id="name"></span><small>SELECTED FRAME / THE ARCHIVE</small></div><div class="actions"><button id="prev" aria-label="Previous photo">←</button><span id="count" class="count"></span><button id="next" aria-label="Next photo">→</button><button id="view">Open print ↗</button></div></div><p id="status" class="sr" aria-live="polite"></p></main><dialog aria-label="Expanded selected photo"><div class="dialog-head"><span>LOS NIÑOS / THE ARCHIVE</span><button id="close">Close ×</button></div><img id="large" alt=""><p id="largeCaption"></p></dialog><script>
(()=>{const photos=[['portrait.webp','In good company','Black and white portrait of a man in a cap'],['street.webp','Off the clock','Man in a white shirt against a wall'],['hat-detail.webp','A closer look','Black and white close-up of a cap'],['caps.webp','A few favourites','Caps arranged on a flag'],['photo-01.webp','Frame 05','Photograph from the Los Niños collection'],['photo-02.webp','Frame 06','Photograph from the Los Niños collection'],['photo-03.webp','Frame 07','Photograph from the Los Niños collection'],['photo-04.webp','Frame 08','Photograph from the Los Niños collection']];const wheel=document.querySelector('.wheel'),rotor=document.querySelector('.rotor'),dialog=document.querySelector('dialog'),reduced=matchMedia('(prefers-reduced-motion: reduce)');let angle=0,selected=0,drag=null,raf=0,last=0;const step=45;
photos.forEach((p,i)=>{const card=document.createElement('div');card.className='print';card.style.setProperty('--angle',i*step+'deg');const img=document.createElement('img');img.src='../assets/photos/'+p[0];img.alt=p[2];img.draggable=false;const label=document.createElement('span');label.textContent=String(i+1).padStart(2,'0')+' — '+p[1].toUpperCase();card.append(img,label);rotor.append(card)});const cards=[...rotor.children];function render(){rotor.style.setProperty('--rotation',angle+'deg');const next=((Math.round(-angle/step)%photos.length)+photos.length)%photos.length;if(next!==selected||!document.querySelector('#name').textContent){selected=next;document.querySelector('#name').textContent=photos[selected][1];document.querySelector('#count').textContent=String(selected+1).padStart(2,'0')+' / 08';cards.forEach((c,i)=>c.classList.toggle('active',i===selected))}}function announce(){document.querySelector('#status').textContent='Selected photo '+(selected+1)+': '+photos[selected][1]}function animateTo(target){cancelAnimationFrame(raf);if(reduced.matches){angle=target;render();announce();return}const start=angle,time=performance.now();function frame(now){const t=Math.min(1,(now-time)/520),ease=1-Math.pow(1-t,4);angle=start+(target-start)*ease;render();if(t<1)raf=requestAnimationFrame(frame);else announce()}raf=requestAnimationFrame(frame)}function snap(){animateTo(Math.round(angle/step)*step)}function turn(delta){animateTo(Math.round(angle/step)*step-delta*step)}function open(){cancelAnimationFrame(raf);angle=-selected*step;render();const p=photos[selected];document.querySelector('#large').src='../assets/photos/'+p[0];document.querySelector('#large').alt=p[2];document.querySelector('#largeCaption').textContent=p[1];dialog.showModal()}
wheel.addEventListener('pointerdown',e=>{if(e.button!==0)return;cancelAnimationFrame(raf);drag={x:e.clientX,y:e.clientY,lastX:e.clientX,time:performance.now(),velocity:0,moved:false};wheel.setPointerCapture(e.pointerId);wheel.classList.add('dragging');wheel.focus({preventScroll:true})});wheel.addEventListener('pointermove',e=>{if(!drag)return;const now=performance.now(),dx=e.clientX-drag.lastX;drag.velocity=dx/Math.max(8,now-drag.time);if(Math.abs(e.clientX-drag.x)>6)drag.moved=true;angle+=dx*.23;drag.lastX=e.clientX;drag.time=now;render()});wheel.addEventListener('pointerup',()=>{if(!drag)return;const velocity=performance.now()-drag.time<90?drag.velocity:0,moved=drag.moved;drag=null;wheel.classList.remove('dragging');if(!moved){snap();return}if(reduced.matches||Math.abs(velocity)<.12){snap();return}let speed=Math.max(-.8,Math.min(.8,velocity))*.23;last=performance.now();function coast(now){const dt=Math.min(32,now-last);last=now;angle+=speed*dt;speed*=Math.pow(.94,dt/16);render();if(Math.abs(speed)>.018)raf=requestAnimationFrame(coast);else snap()}raf=requestAnimationFrame(coast)});wheel.addEventListener('pointercancel',()=>{drag=null;wheel.classList.remove('dragging');snap()});wheel.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Enter',' '].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')turn(-1);else if(e.key==='ArrowRight')turn(1);else open()}});wheel.addEventListener('dblclick',open);document.querySelector('#prev').addEventListener('click',()=>turn(-1));document.querySelector('#next').addEventListener('click',()=>turn(1));document.querySelector('#view').addEventListener('click',open);document.querySelector('#close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>document.querySelector('#view').focus());render()})();
</script></body></html>
