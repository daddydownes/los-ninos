<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Niños — Two lanes</title><style>
@font-face{font-family:B;src:url('../assets/fonts/barlow-condensed-800-latin.woff2')}@font-face{font-family:D;src:url('../assets/fonts/dm-sans-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#08121d;color:#f1eee6;font-family:D,Arial;overflow-x:hidden}button{font:inherit;color:inherit;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;padding:24px 5vw}.brand{font:25px B}header small{font-size:9px;letter-spacing:1.5px;color:#abb5bd}.intro{display:flex;justify-content:space-between;align-items:end;padding:21px 5vw 27px}h1{font:800 clamp(72px,10vw,144px)/.85 B;margin:0;letter-spacing:-.025em}h1 em{font-style:normal;color:#3978ff}.intro p{font-size:11px;line-height:1.6;margin:0;max-width:135px}.gallery{position:relative;overflow:hidden;cursor:grab;touch-action:pan-y;outline:none;padding:4px 0}.gallery.dragging{cursor:grabbing}.lane{display:flex;gap:16px;width:max-content;will-change:transform;padding-bottom:16px}.card{padding:0;border:0;background:none;text-align:left;width:220px;flex:0 0 220px;cursor:inherit;user-select:none}.card img{width:100%;height:225px;object-fit:cover;display:block;pointer-events:none;filter:saturate(.65);transition:filter .2s}.card:hover img{filter:saturate(1)}.card:nth-child(3n+2){width:310px;flex-basis:310px}.card:nth-child(4n) img{object-position:50% 25%}.label{display:flex;justify-content:space-between;font-size:8px;letter-spacing:1px;padding-top:8px;color:#9ba9b4}.label b{font-weight:400;color:#f1eee6}.lane.two{padding-bottom:0}.lane.two img{height:185px}.card:focus-visible{outline:2px solid #3978ff;outline-offset:3px}.gallery:focus-visible{outline:1px solid #3978ff;outline-offset:-1px}.guide{margin:22px 5vw 0;display:flex;justify-content:space-between;align-items:center}.motion{font-size:10px;letter-spacing:1.4px;display:flex;gap:13px;align-items:center}.motion i{font-style:normal;font-size:24px;color:#3978ff}.guide small{font-size:9px;color:#9ba9b4;letter-spacing:1px}.control{display:flex;gap:5px}.control button{width:36px;height:32px;border:1px solid #4d5964;background:none;font-size:16px}.control button:hover{background:#f1eee6;color:#08121d}footer{margin:23px 5vw;padding-top:17px;border-top:1px solid #2e3b46;display:flex;justify-content:space-between;color:#84939f;font-size:9px;letter-spacing:1.4px}dialog{border:0;background:#08121d;padding:0;color:#f1eee6;width:100vw;height:100dvh;max-width:100vw;max-height:100dvh}dialog::backdrop{background:#08121d}dialog img{width:100%;height:100%;object-fit:contain;padding:50px 20px}dialog button{position:absolute;right:20px;top:16px;background:#f1eee6;color:#08121d;border:0;padding:10px 15px}dialog p{position:absolute;bottom:8px;width:100%;text-align:center;font-size:10px;letter-spacing:1px}.hint{animation:hint 1.2s ease-in-out 2}@keyframes hint{50%{transform:translateX(6px)}}@media(max-width:600px){header{padding:23px 6vw}header small{font-size:7px}.intro{padding:27px 6vw 25px}h1{font-size:75px}.intro p{max-width:100px;font-size:9px}.card{width:165px;flex-basis:165px}.card:nth-child(3n+2){width:220px;flex-basis:220px}.card img{height:215px}.lane.two img{height:165px}.lane{gap:12px}.guide{margin:20px 6vw 0}.guide small{display:none}.motion{font-size:8px;gap:8px}footer{font-size:7px;margin:24px 6vw}.label{font-size:7px}}@media(prefers-reduced-motion:reduce){.hint{animation:none}.card img{transition:none}}
</style></head><body><header><span class="brand">LOS NIÑOS®</span><small>ARCHIVE STUDY / 020</small></header><div class="intro"><h1>TWO<br>LANES<em>.</em></h1><p>Different directions.<br>The same energy.<br>Keep looking.</p></div><main><div class="gallery" id="gallery" tabindex="0" role="region" aria-label="Two moving rows of photos. Drag horizontally or use arrow keys to explore. Select a photo to enlarge."><div class="lane" id="first"></div><div class="lane two" id="second"></div></div><div class="guide"><div class="motion"><i class="hint">↔</i><span>DRAG TO FIND YOUR FRAME</span></div><small>CLICK A PHOTO TO OPEN</small><div class="control"><button id="prev" aria-label="Move gallery left">←</button><button id="next" aria-label="Move gallery right">→</button></div></div></main><footer><span>PEOPLE / PLACES / PASSING THROUGH</span><span>NO WRONG DIRECTION</span></footer><dialog id="full"><button id="close">Close ×</button><img id="fullImage" alt=""><p id="fullLabel"></p></dialog><script>
const rows=[['portrait.webp','photo-03.webp','street.webp','photo-09.webp','caps.webp','photo-17.webp'],['photo-27.webp','hat-detail.webp','photo-35.webp','photo-12.webp','photo-22.webp','photo-30.webp']];const gallery=document.querySelector('#gallery'),lanes=[document.querySelector('#first'),document.querySelector('#second')],dialog=document.querySelector('#full'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let offset=0,velocity=0,drag=null,raf=0,suppress=false,span=[1,1];
rows.forEach((files,r)=>{for(let copy=0;copy<3;copy++)files.forEach((file,i)=>{const button=document.createElement('button');button.className='card';button.type='button';button.setAttribute('aria-label',`Open archive photograph ${r*6+i+1}`);if(copy!==1){button.tabIndex=-1;button.setAttribute('aria-hidden','true')}button.innerHTML=`<img src="../assets/photos/${file}" alt="Los Niños archive photograph ${r*6+i+1}" draggable="false"><span class="label"><b>LN — ${String(r*6+i+1).padStart(2,'0')}</b><span>VIEW ↗</span></span>`;button.addEventListener('click',e=>{if(suppress){e.preventDefault();return}document.querySelector('#fullImage').src='../assets/photos/'+file;document.querySelector('#fullImage').alt=`Los Niños archive photograph ${r*6+i+1}`;document.querySelector('#fullLabel').textContent=`LOS NIÑOS / FRAME ${String(r*6+i+1).padStart(2,'0')}`;dialog.showModal()});button.addEventListener('focus',()=>{if(copy===1&&button.matches(':focus-visible')){const target=button.offsetLeft-(gallery.clientWidth-button.clientWidth)/2;offset=r===0?span[r]-target:target-span[r]+130;draw()}});lanes[r].append(button)})});
function mod(n,m){return((n%m)+m)%m}function draw(){lanes.forEach((lane,r)=>{const phase=mod((r===0?offset:-offset)+span[r]/2+(r?130:0),span[r])-span[r]/2;lane.style.transform=`translate3d(${-span[r]+phase}px,0,0)`})}function layout(){lanes.forEach((lane,r)=>span[r]=lane.children[6].offsetLeft-lane.children[0].offsetLeft);draw()}function tick(){raf=0;velocity*=.94;offset+=velocity;draw();if(Math.abs(velocity)>.2)raf=requestAnimationFrame(tick)}function nudge(amount){cancelAnimationFrame(raf);velocity=0;if(reduced){offset+=amount;draw()}else{velocity=amount*.06;raf=requestAnimationFrame(tick)}}gallery.addEventListener('pointerdown',e=>{if(e.button!==0)return;cancelAnimationFrame(raf);raf=0;velocity=0;suppress=false;drag={start:e.clientX,last:e.clientX,time:performance.now(),moved:false};});gallery.addEventListener('pointermove',e=>{if(!drag)return;const delta=e.clientX-drag.last,now=performance.now();if(Math.abs(e.clientX-drag.start)>6){drag.moved=true;suppress=true;gallery.classList.add('dragging');gallery.setPointerCapture(e.pointerId)}if(drag.moved){offset+=delta;velocity=delta/Math.max(1,now-drag.time)*16;draw()}drag.last=e.clientX;drag.time=now});function release(){if(!drag)return;const was=drag.moved,fresh=performance.now()-drag.time<100;drag=null;gallery.classList.remove('dragging');if(was&&fresh&&!reduced)raf=requestAnimationFrame(tick);setTimeout(()=>suppress=false,80)}gallery.addEventListener('pointerup',release);gallery.addEventListener('pointercancel',()=>{drag=null;velocity=0;gallery.classList.remove('dragging');suppress=false});window.addEventListener('pointerup',release);gallery.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();nudge(e.key==='ArrowRight'?-250:250)}});document.querySelector('#prev').addEventListener('click',()=>nudge(250));document.querySelector('#next').addEventListener('click',()=>nudge(-250));document.querySelector('#close').addEventListener('click',()=>dialog.close());window.addEventListener('resize',layout);layout();
</script></body></html>
