<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Niños — Film strip</title>
<style>
@font-face{font-family:Barlow;src:url('../assets/fonts/barlow-condensed-800-latin.woff2')}@font-face{font-family:DM;src:url('../assets/fonts/dm-sans-latin.woff2')}*{box-sizing:border-box}html,body{margin:0;background:#08121d;color:#f1eee6}body{font-family:DM,Arial,sans-serif;overflow-x:hidden}button,input{-webkit-tap-highlight-color:transparent}header{padding:27px 4vw 0;display:flex;justify-content:space-between;align-items:flex-start}.wordmark{font-family:Barlow,Impact,sans-serif;font-size:25px;line-height:1;letter-spacing:-.8px}.edition{font-size:10px;line-height:1.7;text-align:right;letter-spacing:1.4px;text-transform:uppercase}.heading{display:flex;align-items:flex-end;justify-content:space-between;padding:20px 4vw 18px}h1{font-family:Barlow,Impact,sans-serif;font-size:clamp(66px,9.2vw,142px);letter-spacing:-.035em;line-height:.86;font-weight:800;margin:0}.heading p{font-size:11px;max-width:130px;line-height:1.5;margin:0 0 3px;color:#b5b9bb}.blue{color:#2c6bff}.viewport{height:clamp(300px,49vh,640px);position:relative;overflow:hidden;cursor:grab;touch-action:pan-y;outline:none}.viewport:active{cursor:grabbing}.viewport:focus-visible{outline:2px solid #2c6bff;outline-offset:-2px}.track{height:100%;display:flex;gap:18px;position:absolute;top:0;left:50%;will-change:transform}.frame{width:var(--fw,330px);flex:0 0 var(--fw,330px);height:100%;position:relative;opacity:.48;transition:opacity .25s;user-select:none}.frame.active{opacity:1}.image-wrap{height:calc(100% - 36px);overflow:hidden;background:#101f2e}.frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;filter:saturate(.6)}.frame.active img{filter:saturate(.9)}.edge{height:18px;display:flex;justify-content:space-between;align-items:center;font-size:8px;letter-spacing:1.1px;color:#9fa6ac}.holes{height:5px;width:44px;background:repeating-linear-gradient(90deg,#56606a 0 7px,transparent 7px 13px)}.registration{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#2c6bff;pointer-events:none;opacity:.8}.registration:after{content:'';position:absolute;left:-3px;top:0;width:7px;height:7px;background:#2c6bff}.registration{background:linear-gradient(#2c6bff 0 17px,transparent 17px calc(100% - 17px),#2c6bff calc(100% - 17px))}.meta{display:flex;justify-content:space-between;align-items:center;margin:18px 4vw 24px}.caption{font-size:11px;letter-spacing:.6px}.counter{font-family:Barlow;font-size:28px}.counter span{color:#68717a;font-size:17px}.scrub-area{margin:0 auto;width:min(600px,82vw);padding-bottom:23px}.timeline{position:relative;height:54px;border:1px solid #39424b;padding:4px;display:grid;grid-template-columns:repeat(9,1fr);gap:4px;background:#0d1c2a;cursor:ew-resize}.timeline img{width:100%;height:44px;object-fit:cover;opacity:.48;pointer-events:none}.timeline img.selected{opacity:1}.playhead{position:absolute;top:-5px;bottom:-5px;width:calc((100% - 12px)/9);border:2px solid #2c6bff;pointer-events:none;left:4px;box-shadow:0 0 0 1px #08121d}.playhead:before{content:'';position:absolute;width:6px;height:6px;background:#2c6bff;left:calc(50% - 3px);top:-6px}input[type=range]{position:absolute;inset:0;margin:0;width:100%;height:100%;opacity:0;cursor:ew-resize;touch-action:none}.timeline:focus-within{outline:1px solid #f1eee6;outline-offset:7px}.instructions{display:flex;justify-content:space-between;margin-top:13px;font-size:9px;letter-spacing:1.4px;color:#8d99a4;text-transform:uppercase}footer{display:flex;justify-content:space-between;margin:8px 4vw 20px;padding-top:14px;border-top:1px solid #26323e;font-size:9px;letter-spacing:1.5px;color:#83909a}.live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){header{padding:22px 6vw 0}.heading{padding:30px 6vw 20px}h1{font-size:72px}.heading p{max-width:88px;font-size:9px}.viewport{height:46vh;min-height:310px}.track{gap:12px}.meta{margin:17px 6vw 25px}.caption{font-size:9px}.scrub-area{width:88vw}.timeline{height:45px;gap:3px}.timeline img{height:35px}.instructions{font-size:8px;letter-spacing:1px}footer{margin:14px 6vw 20px;font-size:8px}.edition{font-size:8px}.wordmark{font-size:23px}}@media(prefers-reduced-motion:reduce){.frame{transition:none}}
</style></head>
<body>
<header><div class="wordmark">LOS NIÑOS<span class="blue"></span></div><div class="edition">Independent minds.<br>Archive / Vol. 01</div></header>
<div class="heading"><h1>OFF THE<br>RECORD<span class="blue">.</span></h1><p>A few frames<br>from our world.<br>Always in motion.</p></div>
<main><div class="viewport" id="viewport" tabindex="0" role="region" aria-label="Photo film strip. Drag to explore, or use left and right arrow keys."><div class="track" id="track"></div><div class="registration"></div></div>
<div class="meta"><div class="caption" id="caption">01 — THE EVERYDAY UNIFORM</div><div class="counter"><b id="count">01</b><span> / 09</span></div></div>
<div class="scrub-area"><div class="timeline" id="timeline"><div class="playhead" id="playhead"></div><input id="scrubber" type="range" min="0" max="8" step="0.01" value="0" aria-label="Scrub the photo archive" aria-valuetext="Frame 1 of 9"></div><div class="instructions"><span>← Drag the film →</span><span>9 frames / no retakes</span></div></div>
<div class="live" id="live" aria-live="polite"></div></main><footer><span>PEOPLE. PLACES. IN BETWEEN.</span><span>LN — 035 MM</span></footer>
<script>
const photos=[['portrait.webp','THE EVERYDAY UNIFORM','Portrait in a Los Niños cap'],['street.webp','OUTSIDE HOURS','White shirt against a street wall'],['hat-detail.webp','CLOSER LOOK','Close-up of a Los Niños cap'],['photo-03.webp','NO FIXED ADDRESS','Los Niños archive photograph'],['caps.webp','COLOURS WE CARRY','Caps arranged on a flag'],['photo-09.webp','AFTER THE FACT','Los Niños archive photograph'],['photo-17.webp','TAKE THE LONG WAY','Los Niños archive photograph'],['photo-27.webp','SAME DIFFERENCE','Los Niños archive photograph'],['photo-35.webp','UNTIL NEXT TIME','Los Niños archive photograph']];
const track=document.querySelector('#track'),viewport=document.querySelector('#viewport'),range=document.querySelector('#scrubber'),timeline=document.querySelector('#timeline'),playhead=document.querySelector('#playhead'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
photos.forEach(([file,title,alt],i)=>{const frame=document.createElement('article');frame.className='frame';frame.innerHTML=`<div class="edge"><span>LN—${String(i+1).padStart(3,'0')}</span><span class="holes"></span><span>35 MM</span></div><div class="image-wrap"><img src="../assets/photos/${file}" alt="${alt}" draggable="false"></div><div class="edge"><span>LOS NIÑOS / ARCHIVE</span><span>${String(i+1).padStart(2,'0')} ▸</span></div>`;track.append(frame);const thumb=document.createElement('img');thumb.src='../assets/photos/'+file;thumb.alt='';timeline.insertBefore(thumb,playhead)});
const frames=[...track.children],thumbs=[...timeline.querySelectorAll('img')];let position=0,target=0,width=330,gap=18,active=-1,drag=null,raf=0,velocity=0;
function clamp(v){return Math.max(0,Math.min(8,v))}function layout(){gap=innerWidth<=600?12:18;width=Math.min(innerWidth*.73,viewport.clientHeight*.79);track.style.setProperty('--fw',width+'px');draw()}
function draw(){track.style.transform=`translate3d(${-width/2-position*(width+gap)}px,0,0)`;const n=Math.round(clamp(position));playhead.style.left=(4+position*(timeline.clientWidth-8)/9)+'px';range.value=position;range.setAttribute('aria-valuetext',`Frame ${n+1} of 9: ${photos[n][1].toLowerCase()}`);if(n!==active){active=n;frames.forEach((f,i)=>f.classList.toggle('active',i===n));thumbs.forEach((f,i)=>f.classList.toggle('selected',i===n));document.querySelector('#caption').textContent=String(n+1).padStart(2,'0')+' — '+photos[n][1];document.querySelector('#count').textContent=String(n+1).padStart(2,'0');}}
function animate(){raf=0;position+=(target-position)*.16;if(Math.abs(position-target)<.001){position=target;draw();return}draw();raf=requestAnimationFrame(animate)}function move(v,immediate=false){target=clamp(v);if(reduced||immediate){position=target;draw()}else if(!raf)raf=requestAnimationFrame(animate)}function settle(v=target){move(Math.round(v));document.querySelector('#live').textContent=`Frame ${Math.round(target)+1}: ${photos[Math.round(target)][1].toLowerCase()}`}
range.addEventListener('input',()=>move(Number(range.value),true));range.addEventListener('change',()=>settle());range.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();settle(Math.round(target)+(e.key==='ArrowRight'?1:-1))}});
viewport.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();settle(e.key==='Home'?0:e.key==='End'?8:Math.round(target)+(e.key==='ArrowRight'?1:-1))}});
viewport.addEventListener('pointerdown',e=>{if(e.button!==0)return;cancelAnimationFrame(raf);raf=0;target=position;velocity=0;drag={x:e.clientX,start:position,last:e.clientX,time:performance.now()};viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener('pointermove',e=>{if(!drag)return;const now=performance.now();velocity=(drag.last-e.clientX)/Math.max(1,now-drag.time);drag.last=e.clientX;drag.time=now;move(drag.start+(drag.x-e.clientX)/(width+gap),true)});
function release(){if(!drag)return;const fresh=performance.now()-drag.time<100;drag=null;settle(position+(fresh&&!reduced?velocity*160/(width+gap):0))}viewport.addEventListener('pointerup',release);viewport.addEventListener('pointercancel',()=>{drag=null;settle(position)});
let wheelTimer;viewport.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;e.preventDefault();move(target+e.deltaX/(width+gap),true);clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>settle(),110)},{passive:false});window.addEventListener('resize',layout);layout();
</script></body></html>
